name = "threads-digest"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# ── Cron: планировщик (раздел 4.8 ТЗ) ──────────────────────────────────────
# Workers Cron: минимум 1 раз в минуту. Тяжёлые задачи уходят в Queue.
[triggers]
crons = ["*/5 * * * *", "0 6 * * *"]

# ── D1 (раздел 13 ТЗ) ──────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "threads-digest"
database_id = "REPLACE_WITH_D1_ID_AFTER_db_create"
migrations_dir = "src/db/migrations"

# ── R2: медиафайлы, карточки, ролики (30 дней) ─────────────────────────────
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "threads-digest-media"

# ── Queues: очередь задач планировщика ─────────────────────────────────────
[[queues.producers]]
binding = "JOBS"
queue = "threads-digest-jobs"

[[queues.consumers]]
queue = "threads-digest-jobs"
max_batch_size = 10
max_batch_timeout = 30

# ── Workers AI: нейросеть по умолчанию (раздел 5 ТЗ) ───────────────────────
[ai]
binding = "AI"

# ── Containers: только ffmpeg-рендерер Shorts (+ Piper TTS внутри) ──
# Требует Workers Paid ($5/мес). Спит после 5 мин простоя (scale-to-zero) —
# плата только за секунды рендера. Прокси НЕ в контейнере (см. docs/COST.md).
[[containers]]
name = "renderer"
image = "./containers/renderer/Dockerfile"
instance_type = "standard-2"
class_name = "RendererContainer"

[[durable_objects.bindings]]
name = "RENDERER"
class_name = "RendererContainer"

[[migrations]]
tag = "v1"
new_classes = ["RendererContainer"]

# ── Переменные (секреты — только через `wrangler secret put`, см. .dev.vars.example) ──
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://threadsviewer.online"
BOT_USERNAME = "threadsreaderbot"
# Провайдеры: "workers-ai" | "openai-compatible" | "mock"
LLM_PROVIDER = "workers-ai"
LLM_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# TTS: "piper" (в RENDERER-контейнере, бесплатно) | "mock" | внешний API
TTS_PROVIDER = "piper"
# Рендер Shorts: если RENDERER-контейнер не задан/не поднялся — внешний рендерер.
VIDEO_RENDERER_URL = ""
# Прокси-шлюз сборщика: HTTP API прокси-провайдера (Bright Data/Oxylabs/свой Squid).
# Worker дёргает его напрямую — без контейнера, чтобы не биллить круглосуточно.
# Формат запроса контейнера-шлюза сохранён для совместимости: GET /fetch?url=...
PROXY_GATEWAY_URL = ""
R2_BUCKET = "threads-digest-media"

[observability]
enabled = true
