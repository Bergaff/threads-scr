name = "threads-digest"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# ── Cron: планировщик (раздел 4.8 ТЗ) ──────────────────────────────────────
# Workers Cron: минимум 1 раз в минуту. Тяжёлые задачи уходят в Queue.
[triggers]
crons = ["*/5 * * * *", "0 6 * * *"]

# ── D1 (раздел 13 ТЗ) ──────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "threads-digest"
database_id = "21e58e47-3387-45a5-a846-5345d1852033"
migrations_dir = "src/db/migrations"

# ── R2: медиафайлы, карточки, ролики (30 дней) ─────────────────────────────
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "threads-digest-media"

# ── Queues: очередь задач планировщика ─────────────────────────────────────
[[queues.producers]]
binding = "JOBS"
queue = "threads-digest-jobs"

[[queues.consumers]]
queue = "threads-digest-jobs"
max_batch_size = 10
max_batch_timeout = 30

# ── Workers AI: нейросеть по умолчанию (раздел 5 ТЗ) ───────────────────────
[ai]
binding = "AI"

# ── Переменные (секреты — только через `wrangler secret put`, см. .dev.vars.example) ──
[vars]
ENVIRONMENT = "production"
SITE_URL = "https://threadsviewer.online"
BOT_USERNAME = "threadsreaderbot"
# Провайдеры: "workers-ai" | "openai-compatible" | "mock"
LLM_PROVIDER = "workers-ai"
LLM_MODEL = "@cf/meta/llama-3.1-8b-instruct"
# TTS: "piper" (локально на ПК пользователя, бесплатно) | "mock" | внешний API
TTS_PROVIDER = "piper"
# Рендер Shorts и прокси НЕ в Cloudflare-контейнерах (экономим общий бюджет аккаунта):
# это локальный сервис на ПК пользователя (см. local/), доступный Worker'у через туннель.
# VIDEO_RENDERER_URL и PROXY_GATEWAY_URL — НЕ здесь: они меняются при каждом перезапуске
# туннеля, поэтому задаются через `wrangler secret put` (см. docs/CLOUD_SETUP.md).
R2_BUCKET = "threads-digest-media"

[observability]
enabled = true

